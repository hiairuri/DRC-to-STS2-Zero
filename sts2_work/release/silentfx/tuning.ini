#   ring_count = how many, ring_size = their length, halfwidth = how fat (all the spikes),
#   ring = how wide the ring is (1 = as wide as her hit box), ring_flat = how deep it looks (1 = a circle seen face on),
#   ring_y = how far below her middle it lies (fraction of her height), ring_turn = how fast it whirls (radians a second),
#   ring_sweep = how long the flash takes to run round it, ring_out / ring_hold / ring_back = one spike out, held, back in.
#   far_alpha = how much fainter the spikes behind her are.
