# --- 暗影步（v0.47.0：她的影子是一团黑雾。蓄 → 冲 → 甩 → 升 → 悬 → 砸）---
# 待命：dark = 鼠标停在牌上时战场暗多少；hand_dark = 其它手牌暗多少（0~1）
