# 线在牌上的位置和形状（牌自己的单位：牌大约宽 300、高 420，从牌中心量）：
# ink_y = 线在牌中心下方多远（描述区中间）；ink_w = 线有多宽；ink_amp = 第一下摆多高；
# ink_waves = 一共摆几个来回；ink_decay = 摆幅收得多快（越大越快变平）；ink_rise = 整条线从左到右往上斜多少。
planner.ink_y = 108
planner.ink_w = 216
planner.ink_amp = 44
planner.ink_waves = 3.25
planner.ink_decay = 3.4
planner.ink_rise = 10
# write = 画完这条线要多少秒（v0.42.1：0.24 → 0.90，一只手不慌不忙签个名的时间；笔沿着线匀速走，
#         落笔和提笔稍慢）；lean = 笔平时歪多少（弧度）；sway = 画的时候笔跟着线甩多大（弧度）；
# fade_from = 时间过了多少（0~1）笔开始淡出，画完时笔正好没了。
planner.write = 0.90
planner.lean = 0.62
planner.sway = 0.30
planner.fade_from = 0.50
# hold = 1：画的时候牌先不飞（只是画面上晚一点飞，游戏本身不等）；hold_max = 最多扣住多少秒（要比 write 长）；
# takeoff_flash = 牌起飞那一下闪多亮（0 = 不闪）。
planner.hold = 1
planner.hold_max = 1.20
planner.takeoff_flash = 1
# 牌起飞后，线还留多少秒 / 再用多少秒淡掉。
planner.ink_stay = 0.30
planner.ink_fade = 0.40
# 兑现（被它上了奇巧的牌因弃牌自己打出）：牌出现后等多少秒亮出金印；那道光沿线跑完要多少秒；
# 金印一共留多久 / 用多少秒淡掉。
planner.mark_delay = 0.10
planner.mark_run = 0.22
planner.mark_stay = 0.55
planner.mark_fade = 0.40

# ---- 必备工具（v0.42：回合一开始刀就扎进牌堆、把牌挑出来甩进手里；弃牌是拴绳的苦无）----
# early_stab = 1：回合开始抽牌那一刻刀就扎下去（0 = 等第一张牌进手再扎）；stab_y = 刀尖扎在抽牌堆中心上方多少像素。
tools.early_stab = 1
tools.stab_y = 10
# v0.42.3：不管几层只扎一刀——刀扎下去不拔，等这回合头几张牌（几层就几张）出了牌堆，一次挑起一小叠甩出去。
# pack_wait = 每多一层最多多等多少秒（等不齐就先甩已经到的，剩下的再补一刀）；
# pack_spread = 刀尖上那叠牌相邻两张错开多少（弧度）；toss_gap = 甩出去后相邻两张落进手里相隔多少秒。
tools.pack_wait = 0.32
tools.pack_spread = 0.22
tools.toss_gap = 0.07
# lever_size = 牌被挑出牌堆、挂在刀尖上时有多大（相对它在手里的大小）；
# toss_time = 牌离开刀尖飞到手里要多少秒；toss_hop = 这道弧线拱多高（像素）；toss_trail = 牌后面那道银光多宽（0 = 没有）。
tools.lever_size = 0.56
tools.toss_time = 0.46
tools.toss_hop = 230
tools.toss_trail = 9
# 苦无的大小。
tools.kunai_size = 1.5
# 选弃牌时：draw_lift = 苦无停在弃牌堆中心上方多少像素；draw_min / draw_back = 没选牌 / 选好牌时往后拉多少像素；
# slide = 绳子的固定点滑到"待选区和弃牌堆正中间"有多快（越大越快）。
tools.draw_lift = 30
tools.draw_min = 6
tools.draw_back = 38
tools.slide = 8
# 确定后（v0.42.2）：选了两张以上，先收拢成一摞——gather_time = 收拢要多少秒（0 = 自动：跟着洗牌声最响的那一下）；
# gather_volume = 洗牌声（用的是"计算下注·洗牌"那个声音）多响；gather_rest = 收好后停多少秒苦无才射。
tools.gather_time = 0
tools.gather_volume = 0.85
tools.gather_rest = 0.07
# shot_speed = 苦无射出去多快（像素/秒）；embed = 刀刃扎进牌里多深（苦无自己的单位：整把长 66、刃长 39；
# 扎进去的那一截不画，牌上留一道口子和影子）；knock = 牌被扎中时往后一震多少像素；
# stick = 扎中后停多少秒；pull_time = 带着牌弹回弃牌堆要多少秒；pull_shrink = 牌进牌堆时缩到多小。
tools.shot_speed = 9000
tools.embed = 22
tools.knock = 12
tools.stick = 0.12
tools.pull_time = 0.28
tools.pull_shrink = 0.16
# v0.42.4：回到弃牌堆时不急停——苦无带着余势绕空中的固定点转一圈卸力（牌从刃上滑下去直接进弃牌堆），再轻轻晃着挂好。
# loop_time = 转这一圈用多少秒；loop_keep = 转完还剩多少劲（0 = 转完就静止，越大挂好后晃得越厉害）；
# loop_lag = 苦无回来时固定点离家还有多少像素（让这一圈转在屏幕里面，不贴着角落）。
tools.loop_time = 0.60
tools.loop_keep = 0.15
tools.loop_lag = 90

# ---- 独门技术（v0.43.3：牌上平时什么都没有；回合结束别的牌被弃掉时，它留下的牌往下一缩让过去、再升回来，一道蓝光扫过牌面）----
# expertise_tie = 1 开 / 0 关；expertise_duck = 往下缩多少像素；expertise_hold = 缩下去后多少秒开始升回来；
# expertise_glow = 扫过牌面的那道光最亮时有多亮（0~1）。这回合结束没有牌要进弃牌堆时不缩，只扫光。
moves.expertise_tie = 1
moves.expertise_duck = 130
moves.expertise_hold = 0.36
moves.expertise_glow = 0.45
# v0.43.4 抽牌："从台面下递上来"——牌在抽牌堆那里往下一沉、钻到屏幕底边下面，一点蓝光贴着底边滑到它的位置，牌从底下升进手里。
# （v0.43.5：原来的"像羽毛飘进手"删掉了，没有开关了。）expertise_under_time = 一张牌从沉下去到升到位总共多少秒；
# expertise_glint = 贴着底边滑的那点蓝光多亮（0~1）。
moves.expertise_under_time = 0.66
moves.expertise_glint = 0.7

# ---- 回响斩击（v0.44.0 重做：水平面里的刀气；杀了谁，刀气就从谁身上弹出去，跟游戏真实的每一下结算走）----
# echo.tilt = 那个水平面看上去有多扁（屏幕上椭圆的高 ÷ 宽；越小越像贴着视线的一片）
# echo.size = 飞出去的那一段月牙有多长（它所在平面里的像素，半长）
# echo.first = 打出后多少秒她那一刀到最远的敌人（游戏的第一下几乎是立刻结算的；结算先到的话刀气会赶上去，见 catch_up）
# echo.catch_up = 游戏已经结算、刀气还没到时，最多用多少秒赶到
# echo.gap = 两下结算之间的秒数；0 = 自动（正常 0.2、快速 0.1，从第二下起用实测值）
# echo.fade = 穿过敌人之后多少秒吹散
# echo.spin = 被杀的敌人身上那一圈气转多快（弧度/秒）
# echo.strength = 整体亮度；echo.edge = 前沿那道边的粗细；echo.feather = 边后面羽化拖多长；echo.thin = 气有多"虚"（0 完整 ~ 0.8 很散）
# echo.warp = 1 刀气会把它后面的画面轻轻推歪（像空气）/ 0 只有光；echo.bend = 推多少像素
# echo.force_hits = 调试用：大于 1 时，第一下没杀死任何敌人也假装杀了几只、把后面的回弹演出来（共演这么多下）；平时保持 0
# echo.preview_hits = 开发预览里一共演几下
echo.tilt = 0.20
echo.size = 470
echo.first = 0.13
echo.catch_up = 0.06
echo.gap = 0
echo.fade = 0.26
echo.spin = 15
echo.strength = 0.95
echo.edge = 3.4
echo.feather = 30
echo.thin = 0.2
echo.warp = 1
echo.bend = 12
echo.force_hits = 0
echo.preview_hits = 3

# [MP] Multiplayer adaptation master switch.
mp.remote_fx = 1
