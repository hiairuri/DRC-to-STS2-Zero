# 节奏（秒）：charge = 出发前蓄力；round = 从冲出去到悬在她头顶；hang = 悬在头顶停多久；
# rear = 砸之前往上仰一下；drop = 从头顶砸到脚底；stop = 砸地那一下动画顿多久（0 不顿）；after = 落地后贴地的雾多久散完
