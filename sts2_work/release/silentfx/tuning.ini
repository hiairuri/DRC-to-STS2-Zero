shadowstep.round = 1.5
shadowstep.hang = 0.30
shadowstep.rear = 0.16
shadowstep.drop = 0.15
shadowstep.stop = 0.05
shadowstep.after = 0.55
# 大小：size = 整团雾多大（1 = 现在这么大）；top = 飞到顶上盖过状态栏时再放大多少倍
# gather = 一张牌都还没卷到时，雾是满的几成（卷得越多越大）；land = 砸到地面时雾团多大；dip = 沿手牌那段往下沉多少（占屏幕高度）
shadowstep.size = 1.0
shadowstep.top = 1.0
shadowstep.gather = 0.85
shadowstep.land = 0.15
shadowstep.dip = 0.032
# 拖影：tail = 彗尾是它过去多少秒走过的路（越大越长）；tail_wide = 彗尾多粗；comb = 跑得快时雾被梳成多长的丝（1 = 不梳）
# sweep = 那些丝往两侧后掠多少；stretch = 速度把雾团拉长多少；speed_glow = 快的时候薄处紫光加亮多少（大了会像描边）
# trail = 身后挂着的雾多少秒才散；linger_gap = 每隔多远留一团挂着的雾
