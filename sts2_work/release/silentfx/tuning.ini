# The freeze: 1 = after Bullet Time is played, time stands still on screen for the rest of the turn - cards
# played afterwards hang frozen in the air, and their effects (ours and the game's), the sounds, the damage numbers and the health bars are
# all held back and shown together when the turn ends. 0 = off (only the clock and the blue flash).
# It only changes what is shown, never what happens, and is always off in co-op.
bullet.freeze = 1
# While time is stopped the sounds of what the cards do wait as well (1), or play at once as usual (0).
bullet.hold_sound = 1
# When time starts again everything that was held back comes out in the order it happened - but all but at once:
# the whole catching-up is squeezed into this many seconds (it used to be 1.6, one thing after another).
bullet.replay = 0.10
bullet.card_scale = 0.42
bullet.cards_per_row = 9
# What stopped time looks like.
# filter = 1: the cold light is a filter over the fight that drains its colour, darkens the corners and lets rings
# spread from her (0 = the plain blue tint of before; a fight with a backdrop of its own always gets the plain tint).
# filter_amount = how strong the filter is (0..1). ring_first / ring_speed = how fast the ring spreads when time stops,
# and the one each card played afterwards sends out (screen heights per second).
bullet.filter = 1
bullet.filter_amount = 0.85
bullet.ring_first = 1.3
bullet.ring_speed = 0.20
bullet.ring_start = 0.10
# enemy_speed = how fast the enemies still move while time is stopped (1 = normal, 0.04 = they barely breathe).
bullet.enemy_speed = 0.04
# floaters = 1: a Shiv thrown in stopped time is seen leaving her hand, braking and hanging in the air short of the
# enemy until time starts again. float_gap = how many pixels short of the enemy it stops, float_brake = how hard it brakes.
bullet.floaters = 1
bullet.float_gap = 150
bullet.float_brake = 3.0
# hold_death = 1: an enemy killed in stopped time stays standing until time starts again, then falls.
bullet.hold_death = 1
# replay_won = like bullet.replay, but for when the last enemy dies in stopped time (the game is already moving on).
bullet.replay_won = 0.10
# yield_to_other_mods = 1: if the mod "Bullet Time: As Depicted" is installed too, SilentFX does not stop time itself
# (two freezes at once fight each other). 0 = stop time anyway.
bullet.yield_to_other_mods = 1

