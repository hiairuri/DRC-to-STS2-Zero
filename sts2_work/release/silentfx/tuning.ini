thorns.ring_y = 0.08
thorns.ring_turn = 4.5
thorns.ring_sweep = 0.10
thorns.ring_out = 0.06
thorns.ring_hold = 0.14
thorns.ring_back = 0.22
thorns.far_alpha = 0.55
# She is attacked: three short spikes out of her side at the attacker.
